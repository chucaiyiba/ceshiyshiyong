<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单五子棋</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f7f4e9, #e5d3aa);
      color: #2f2a20;
    }

    .game {
      width: min(92vw, 760px);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(3px);
      border-radius: 16px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.14);
      padding: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status {
      font-size: 18px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #735735;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #8a6540;
    }

    button:active {
      transform: translateY(0);
    }

    #board {
      width: min(90vw, 640px);
      height: min(90vw, 640px);
      max-height: 640px;
      display: block;
      margin: 0 auto;
      background: #d8ad71;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    .hint {
      margin-top: 12px;
      opacity: 0.8;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>五子棋</h1>
    <div class="panel">
      <div class="status" id="status">黑棋先手</div>
      <div class="controls">
        <button id="restart">重新开始</button>
        <button id="undo">悔棋</button>
      </div>
    </div>
    <canvas id="board" width="640" height="640" aria-label="五子棋棋盘"></canvas>
    <p class="hint">规则：双方轮流落子，先连成任意方向五子者获胜。</p>
  </main>

  <script>
    const BOARD_SIZE = 15;
    const EMPTY = 0;
    const BLACK = 1;
    const WHITE = 2;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');
    const undoBtn = document.getElementById('undo');

    let board = [];
    let currentPlayer = BLACK;
    let gameOver = false;
    let history = [];

    function initBoard() {
      board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
      currentPlayer = BLACK;
      gameOver = false;
      history = [];
      updateStatus('黑棋先手');
      draw();
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function drawBoardGrid() {
      const cell = canvas.width / (BOARD_SIZE + 1);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#5d3d21';
      ctx.lineWidth = 1;

      for (let i = 1; i <= BOARD_SIZE; i++) {
        const offset = i * cell;
        ctx.beginPath();
        ctx.moveTo(cell, offset);
        ctx.lineTo(canvas.width - cell, offset);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(offset, cell);
        ctx.lineTo(offset, canvas.height - cell);
        ctx.stroke();
      }

      const stars = [3, 7, 11];
      ctx.fillStyle = '#3e2b17';
      for (const x of stars) {
        for (const y of stars) {
          ctx.beginPath();
          ctx.arc((x + 1) * cell, (y + 1) * cell, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawStones() {
      const cell = canvas.width / (BOARD_SIZE + 1);
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const value = board[row][col];
          if (value === EMPTY) continue;

          const x = (col + 1) * cell;
          const y = (row + 1) * cell;
          const gradient = ctx.createRadialGradient(
            x - 7,
            y - 7,
            2,
            x,
            y,
            cell * 0.42
          );

          if (value === BLACK) {
            gradient.addColorStop(0, '#6f6f6f');
            gradient.addColorStop(1, '#0f0f0f');
          } else {
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#d6d6d6');
          }

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, cell * 0.42, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function draw() {
      drawBoardGrid();
      drawStones();
    }

    function getBoardPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = (event.clientX - rect.left) * scaleX;
      const y = (event.clientY - rect.top) * scaleY;

      const cell = canvas.width / (BOARD_SIZE + 1);
      const col = Math.round(x / cell) - 1;
      const row = Math.round(y / cell) - 1;

      if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) {
        return null;
      }
      return { row, col };
    }

    function countDirection(row, col, dr, dc, player) {
      let count = 0;
      let r = row + dr;
      let c = col + dc;
      while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
        count += 1;
        r += dr;
        c += dc;
      }
      return count;
    }

    function checkWin(row, col, player) {
      const directions = [
        [0, 1],
        [1, 0],
        [1, 1],
        [1, -1],
      ];

      return directions.some(([dr, dc]) => {
        const total = 1 + countDirection(row, col, dr, dc, player) + countDirection(row, col, -dr, -dc, player);
        return total >= 5;
      });
    }

    function handleMove(event) {
      if (gameOver) return;
      const pos = getBoardPosition(event);
      if (!pos) return;

      const { row, col } = pos;
      if (board[row][col] !== EMPTY) return;

      board[row][col] = currentPlayer;
      history.push({ row, col, player: currentPlayer });

      if (checkWin(row, col, currentPlayer)) {
        gameOver = true;
        draw();
        updateStatus(`${currentPlayer === BLACK ? '黑棋' : '白棋'}获胜！`);
        return;
      }

      currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
      updateStatus(`轮到${currentPlayer === BLACK ? '黑棋' : '白棋'}`);
      draw();
    }

    function undoMove() {
      if (history.length === 0) return;
      const last = history.pop();
      board[last.row][last.col] = EMPTY;
      currentPlayer = last.player;
      gameOver = false;
      updateStatus(`轮到${currentPlayer === BLACK ? '黑棋' : '白棋'}`);
      draw();
    }

    canvas.addEventListener('click', handleMove);
    restartBtn.addEventListener('click', initBoard);
    undoBtn.addEventListener('click', undoMove);

    initBoard();
  </script>
</body>
</html>
